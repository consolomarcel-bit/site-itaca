<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Véu e Chama: Ítaca – O Retorno ao Centro</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --gold: #c5a059;
            --gold-light: #e5c383;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: linear-gradient(to bottom, #1a140a 0%, var(--bg-color) 100%);
        }

        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.2);
            overflow: hidden;
            border: 2px solid var(--gold);
            background-color: #000;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .tabs-wrapper {
            display: flex;
            flex-direction: column;
        }

        .nav-tabs {
            display: flex;
            overflow-x: auto;
            background-color: var(--card-bg);
            border-top: 1px solid #262626;
            border-bottom: 1px solid #262626;
            position: sticky;
            top: 0;
            z-index: 1000;
            scrollbar-width: none;
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-label {
            flex: 0 0 auto;
            padding: 15px 18px;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        input[type="radio"].tab-switch {
            display: none;
        }

        .tab-content {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            padding: 25px 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #tab1:checked ~ .nav-tabs .label1,
        #tab2:checked ~ .nav-tabs .label2,
        #tab3:checked ~ .nav-tabs .label3,
        #tab4:checked ~ .nav-tabs .label4,
        #tab5:checked ~ .nav-tabs .label5 {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
            background-color: rgba(197, 160, 89, 0.05);
        }

        #tab1:checked ~ .content-container #manifesto,
        #tab2:checked ~ .content-container #linhagem,
        #tab3:checked ~ .content-container #cronograma,
        #tab4:checked ~ .content-container #cadastro,
        #tab5:checked ~ .content-container #duvidas {
            display: block;
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.25rem;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding-bottom: 8px;
            letter-spacing: 1px;
        }

        h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.05rem;
            margin: 20px 0 10px;
            letter-spacing: 1px;
        }

        p {
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #ccc;
            text-align: left;
        }

        ul {
            margin-bottom: 15px;
            padding-left: 20px;
            color: #ccc;
            font-size: 0.95rem;
        }

        li {
            margin-bottom: 5px;
        }

        .highlight-box {
            background-color: var(--card-bg);
            border-left: 3px solid var(--gold);
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }

        .highlight-box p {
            margin-bottom: 0;
            font-style: italic;
            color: var(--gold-light);
            text-align: left;
        }

        .day-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.1rem;
            margin: 30px 0 15px;
            border-left: 3px solid var(--gold);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-subtitle {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 0.95rem;
            margin-top: 15px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .timeline {
            border-left: 1px solid #262626;
            padding-left: 15px;
            margin-left: 10px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 5px;
            width: 9px;
            height: 9px;
            background-color: var(--gold);
            border-radius: 50%;
        }

        .time {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: bold;
        }

        .event-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            text-align: left;
        }

        .event-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: left;
        }

        form {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #080808;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
        }

        .note-text {
            font-size: 0.8rem;
            color: var(--gold-light);
            margin-top: 10px;
            font-style: italic;
            text-align: center;
        }

        button.btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #a47f3b 0%, #c5a059 100%);
            border: none;
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        .faq-box {
            background-color: var(--card-bg);
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #1f1f1f;
        }

        .faq-box input[type="checkbox"] {
            display: none;
        }

        .faq-title {
            padding: 15px;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .faq-text {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: left;
        }

        .faq-box input[type="checkbox"]:checked ~ .faq-text {
            max-height: 350px;
            padding: 10px 15px 15px 15px;
            border-top: 1px solid #1f1f1f;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 0.75rem;
            color: #555;
            border-top: 1px solid #141414;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://ibb.co" alt="Logo Véu e Chama">
        </div>
        <h1>VÉU & CHAMA</h1>
        <div class="subtitle">ÍTACA • O RETORNO AO CENTRO</div>
    </header>

    <div class="tabs-wrapper">
        <input type="radio" name="tabs" id="tab1" class="tab-switch" checked>
